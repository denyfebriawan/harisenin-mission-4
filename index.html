<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="max-w-4xl mx-auto p-4 md:p-8">

    <!-- ===== Profile card ===== -->
    <header class="bg-white rounded-2xl shadow p-5 mb-6 flex flex-col sm:flex-row gap-4 sm:items-center sm:justify-between">
      <div class="flex-1">
        <label for="profileName" class="block text-xs font-medium text-slate-400 uppercase tracking-wide">Name</label>
        <input
          id="profileName"
          type="text"
          placeholder="Your name"
          class="w-full text-lg font-semibold text-slate-800 outline-none placeholder:font-normal placeholder:text-slate-300"
        />
        <label for="profilePosition" class="block text-xs font-medium text-slate-400 uppercase tracking-wide mt-2">Position</label>
        <input
          id="profilePosition"
          type="text"
          placeholder="Your position"
          class="w-full text-sm text-slate-500 outline-none placeholder:text-slate-300"
        />
      </div>
    </header>

    <!-- ===== New task form ===== -->
    <section class="bg-white rounded-2xl shadow p-5 mb-6">
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wide mb-3">Add a task</h2>
      <form id="taskForm" class="space-y-4">
        <div>
          <label for="taskText" class="block text-sm font-medium text-slate-600 mb-1">Task</label>
          <textarea
            id="taskText"
            rows="3"
            required
            placeholder="Write what needs to be done..."
            class="w-full rounded-lg border border-slate-200 p-3 text-sm outline-none focus:ring-2 focus:ring-indigo-400"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="taskPriority" class="block text-sm font-medium text-slate-600 mb-1">Priority</label>
            <select
              id="taskPriority"
              class="w-full rounded-lg border border-slate-200 p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-400"
            >
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div>
            <label for="taskDueDate" class="block text-sm font-medium text-slate-600 mb-1">Due date &amp; time</label>
            <input
              id="taskDueDate"
              type="datetime-local"
              required
              class="w-full rounded-lg border border-slate-200 p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-400"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full sm:w-auto px-5 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition"
        >
          Submit task
        </button>
      </form>
    </section>

    <!-- ===== Delete all ===== -->
    <div class="flex justify-end mb-4">
      <button
        id="deleteAllBtn"
        class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-rose-100 text-rose-700 text-sm font-semibold hover:bg-rose-200 transition"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
          <path d="M3 6h18" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
        Delete all tasks
      </button>
    </div>

    <!-- ===== Overdue list ===== -->
    <section class="mb-6">
      <h2 class="text-sm font-semibold text-rose-600 uppercase tracking-wide mb-2">Overdue</h2>
      <div id="overdueList" class="space-y-3">
        <p class="text-sm text-slate-400 italic" data-empty-msg>No overdue tasks.</p>
      </div>
    </section>

    <!-- ===== To Do list ===== -->
    <section class="mb-6">
      <h2 class="text-sm font-semibold text-indigo-600 uppercase tracking-wide mb-2">To Do</h2>
      <div id="todoList" class="space-y-3">
        <p class="text-sm text-slate-400 italic" data-empty-msg>Nothing to do yet.</p>
      </div>
    </section>

    <!-- ===== Done list ===== -->
    <section class="mb-6">
      <h2 class="text-sm font-semibold text-emerald-600 uppercase tracking-wide mb-2">Done</h2>
      <div id="doneList" class="space-y-3">
        <p class="text-sm text-slate-400 italic" data-empty-msg>No finished tasks yet.</p>
      </div>
    </section>

  </div>

  <!-- Reusable template for a single task card -->
  <template id="taskCardTemplate">
    <div class="task-card bg-white rounded-xl shadow-sm p-4 flex items-start gap-3">
      <input type="checkbox" class="task-checkbox mt-1 w-4 h-4 accent-indigo-600 cursor-pointer" />
      <div class="flex-1 min-w-0">
        <p class="task-text text-sm text-slate-800 break-words"></p>
        <div class="flex flex-wrap gap-2 mt-2 text-xs">
          <span class="priority-badge px-2 py-0.5 rounded-full font-medium"></span>
          <span class="created-at text-slate-400"></span>
          <span class="due-at text-slate-400"></span>
        </div>
      </div>
      <button
        class="delete-btn shrink-0 p-2 rounded-full text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition"
        aria-label="Delete task"
        title="Delete task"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
          <path d="M3 6h18" />
          <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
      </button>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
